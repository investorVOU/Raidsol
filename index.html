
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Solana Raid | DEGEN_PROTOCOL</title>
    <!-- PWA -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <meta name="theme-color" content="#0a0a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SolRaid" />
    <!-- SEO -->
    <meta name="description" content="Degen on-chain raiding game — extract or get busted. Built on Solana." />
    <meta property="og:title" content="Solana Raid | DEGEN_PROTOCOL" />
    <meta property="og:description" content="Degen on-chain raiding game — extract or get busted." />
    <meta property="og:image" content="/icon-512.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,900&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    <style>
      :root {
        --solana-green: #14F195;
        --solana-purple: #9945FF;
        --solana-cyan: #00FBFF;
        /* Safe area insets for notches and Android gesture nav bar */
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);

        /* ── Theme tokens (dark default) ── */
        --app-bg:          #0a0a1a;
        --nav-bg:          #07071a;
        --modal-bg:        #080820;
        --modal-bg-alt:    #08071f;
        --card-bg:         rgba(255,255,255,0.04);
        --card-bg-mid:     rgba(255,255,255,0.06);
        --card-bg-strong:  rgba(255,255,255,0.09);
        --border-col:      rgba(255,255,255,0.10);
        --border-col-mid:  rgba(255,255,255,0.14);
        --border-col-str:  rgba(255,255,255,0.22);
        --text-primary:    #ffffff;
        --text-75:         rgba(255,255,255,0.75);
        --text-50:         rgba(255,255,255,0.50);
        --text-45:         rgba(255,255,255,0.45);
        --text-35:         rgba(255,255,255,0.35);
        --text-30:         rgba(255,255,255,0.30);
        --text-25:         rgba(255,255,255,0.25);
        --text-20:         rgba(255,255,255,0.20);
        --text-dim:        rgba(255,255,255,0.18);
      }

      /* ── Light mode overrides ── */
      html.light {
        --app-bg:          #f0f0f4;
        --nav-bg:          #e2e2ea;
        --modal-bg:        #f7f7fb;
        --modal-bg-alt:    #f5f3fe;
        --card-bg:         rgba(0,0,0,0.04);
        --card-bg-mid:     rgba(0,0,0,0.06);
        --card-bg-strong:  rgba(0,0,0,0.09);
        --border-col:      rgba(0,0,0,0.10);
        --border-col-mid:  rgba(0,0,0,0.14);
        --border-col-str:  rgba(0,0,0,0.22);
        --text-primary:    #111111;
        --text-75:         rgba(0,0,0,0.78);
        --text-50:         rgba(0,0,0,0.58);
        --text-45:         rgba(0,0,0,0.52);
        --text-35:         rgba(0,0,0,0.44);
        --text-30:         rgba(0,0,0,0.38);
        --text-25:         rgba(0,0,0,0.32);
        --text-20:         rgba(0,0,0,0.26);
        --text-dim:        rgba(0,0,0,0.22);
      }

      /* ── Light mode: remap Tailwind white-text utilities ── */
      html.light .text-white           { color: #111111 !important; }
      html.light .text-white\/80       { color: rgba(0,0,0,0.84) !important; }
      html.light .text-white\/75       { color: rgba(0,0,0,0.78) !important; }
      html.light .text-white\/70       { color: rgba(0,0,0,0.73) !important; }
      html.light .text-white\/65       { color: rgba(0,0,0,0.68) !important; }
      html.light .text-white\/60       { color: rgba(0,0,0,0.63) !important; }
      html.light .text-white\/55       { color: rgba(0,0,0,0.58) !important; }
      html.light .text-white\/50       { color: rgba(0,0,0,0.55) !important; }
      html.light .text-white\/45       { color: rgba(0,0,0,0.50) !important; }
      html.light .text-white\/40       { color: rgba(0,0,0,0.46) !important; }
      html.light .text-white\/35       { color: rgba(0,0,0,0.42) !important; }
      html.light .text-white\/32       { color: rgba(0,0,0,0.39) !important; }
      html.light .text-white\/30       { color: rgba(0,0,0,0.36) !important; }
      html.light .text-white\/28       { color: rgba(0,0,0,0.34) !important; }
      html.light .text-white\/25       { color: rgba(0,0,0,0.31) !important; }
      html.light .text-white\/22       { color: rgba(0,0,0,0.28) !important; }
      html.light .text-white\/20       { color: rgba(0,0,0,0.26) !important; }
      html.light .text-white\/15       { color: rgba(0,0,0,0.20) !important; }
      html.light .text-white\/10       { color: rgba(0,0,0,0.14) !important; }

      /* ── Light mode: remap Tailwind white-bg utilities ── */
      html.light .bg-white\/3          { background: rgba(0,0,0,0.03) !important; }
      html.light .bg-white\/5          { background: rgba(0,0,0,0.04) !important; }
      html.light .bg-white\/8          { background: rgba(0,0,0,0.06) !important; }
      html.light .bg-white\/10         { background: rgba(0,0,0,0.08) !important; }
      html.light .bg-white\/15         { background: rgba(0,0,0,0.11) !important; }
      html.light .bg-white\/20         { background: rgba(0,0,0,0.14) !important; }
      html.light .bg-white\/25         { background: rgba(0,0,0,0.18) !important; }
      html.light .bg-white\/30         { background: rgba(0,0,0,0.22) !important; }
      html.light .bg-white\/40         { background: rgba(0,0,0,0.28) !important; }
      html.light .bg-white\/50         { background: rgba(0,0,0,0.35) !important; }

      /* ── Light mode: remap Tailwind white-border utilities ── */
      html.light .border-white\/5      { border-color: rgba(0,0,0,0.06) !important; }
      html.light .border-white\/6      { border-color: rgba(0,0,0,0.07) !important; }
      html.light .border-white\/7      { border-color: rgba(0,0,0,0.08) !important; }
      html.light .border-white\/8      { border-color: rgba(0,0,0,0.09) !important; }
      html.light .border-white\/10     { border-color: rgba(0,0,0,0.11) !important; }
      html.light .border-white\/12     { border-color: rgba(0,0,0,0.13) !important; }
      html.light .border-white\/15     { border-color: rgba(0,0,0,0.15) !important; }
      html.light .border-white\/18     { border-color: rgba(0,0,0,0.18) !important; }
      html.light .border-white\/20     { border-color: rgba(0,0,0,0.20) !important; }
      html.light .border-white\/25     { border-color: rgba(0,0,0,0.24) !important; }
      html.light .border-white\/30     { border-color: rgba(0,0,0,0.28) !important; }
      /* ── Light mode: remap placeholder-white utilities ── */
      html.light .placeholder-white\/10::placeholder  { color: rgba(0,0,0,0.14) !important; }
      html.light .placeholder-white\/15::placeholder  { color: rgba(0,0,0,0.20) !important; }
      html.light .placeholder-white\/20::placeholder  { color: rgba(0,0,0,0.26) !important; }
      html.light .placeholder-white\/25::placeholder  { color: rgba(0,0,0,0.32) !important; }

      /* ── Light mode: remap divide-white utilities ── */
      html.light .divide-white\/5  > * + * { border-color: rgba(0,0,0,0.06) !important; }
      html.light .divide-white\/8  > * + * { border-color: rgba(0,0,0,0.09) !important; }
      html.light .divide-white\/10 > * + * { border-color: rgba(0,0,0,0.11) !important; }

      /* ── Light mode: remap common arbitrary bg/border Tailwind classes ── */
      html.light .bg-black             { background-color: var(--modal-bg) !important; }
      html.light .bg-black\/40         { background: rgba(0,0,0,0.08) !important; }
      html.light .bg-black\/50         { background: rgba(0,0,0,0.10) !important; }
      html.light .bg-black\/60         { background: rgba(0,0,0,0.12) !important; }
      html.light .bg-black\/70         { background: rgba(0,0,0,0.38) !important; }
      html.light .bg-black\/80         { background: rgba(240,240,244,0.88) !important; }
      html.light .bg-black\/85         { background: rgba(240,240,244,0.92) !important; }
      html.light .bg-black\/90         { background: rgba(240,240,244,0.94) !important; }

      /* ── Light mode: hide dark scanline overlay ── */
      html.light .pixel-grid { opacity: 0; }

      /* ── Light mode: remap hardcoded dark screen backgrounds ── */
      html.light .bg-\[#000\],
      html.light .bg-\[#000000\]       { background-color: var(--app-bg) !important; }
      html.light .bg-\[#020202\]       { background-color: var(--app-bg) !important; }
      html.light .bg-\[#0a0a1a\]       { background-color: var(--app-bg) !important; }
      html.light .bg-\[#07071a\]       { background-color: var(--nav-bg) !important; }
      html.light .bg-\[#080820\]       { background-color: var(--modal-bg) !important; }
      html.light .bg-\[#08071f\]       { background-color: var(--modal-bg) !important; }
      html.light .bg-\[#050505\]       { background-color: var(--modal-bg) !important; }
      html.light .bg-\[#0c0c20\]       { background-color: var(--modal-bg) !important; }
      html.light .bg-\[#050508\]       { background-color: var(--app-bg) !important; }
      html.light .bg-\[#05050f\]       { background-color: var(--app-bg) !important; }
      html.light .bg-\[#060612\]       { background-color: var(--modal-bg) !important; }
      html.light .bg-\[#07070f\]       { background-color: var(--nav-bg) !important; }
      html.light .bg-\[#09090b\]       { background-color: rgba(0,0,0,0.05) !important; }
      html.light .bg-\[#0d0d18\]       { background-color: rgba(0,0,0,0.05) !important; }
      html.light .bg-\[#0f0f1a\]       { background-color: var(--app-bg) !important; }
      html.light .bg-\[#1a1a1a\]       { background-color: rgba(0,0,0,0.08) !important; }

      body {
        font-family: 'JetBrains Mono', monospace;
        background-color: var(--app-bg);
        color: var(--text-primary);
        margin: 0;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      .text-gradient-solana {
        background: linear-gradient(90deg, var(--solana-green), var(--solana-purple));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .bg-gradient-solana {
        background: linear-gradient(135deg, var(--solana-purple), var(--solana-green));
      }

      /* DEGEN GAME STYLE */
      .tech-border {
        border: 2px solid #222;
        box-shadow: 4px 4px 0px #000;
        position: relative;
        transition: all 0.1s ease;
      }
      .tech-border:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0px #000;
      }
      
      .neon-glow-green { box-shadow: 0 0 20px rgba(20, 241, 149, 0.4); }
      .neon-glow-purple { box-shadow: 0 0 20px rgba(153, 69, 255, 0.4); }
      .neon-glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

      .scanline {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, transparent 50%, rgba(20, 241, 149, 0.03) 50%);
        background-size: 100% 4px;
        z-index: 99;
        pointer-events: none;
        opacity: 0.5;
      }

      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      @keyframes glitch-text {
        0% { transform: translate(0); text-shadow: -2px 0 var(--solana-purple), 2px 0 var(--solana-green); }
        25% { transform: translate(-1px, 1px); }
        50% { transform: translate(1px, -1px); text-shadow: 2px 0 var(--solana-purple), -2px 0 var(--solana-green); }
        75% { transform: translate(-1px, -1px); }
        100% { transform: translate(0); }
      }
      .glitch-text {
        animation: glitch-text 0.3s infinite;
      }
      
      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      .pixel-grid {
        background-image: 
          linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), 
          linear-gradient(90deg, rgba(153, 69, 255, 0.05), rgba(20, 241, 149, 0.03), rgba(0, 251, 255, 0.05));
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
      }

      .chromatic-aberration {
        text-shadow: 2px 0 0 rgba(255,0,255,0.7), -2px 0 0 rgba(0,255,255,0.7);
      }

      /* Floating SR Popup Animation */
      @keyframes float-up-sr {
        0% { transform: translateY(0) scale(0.8); opacity: 0; }
        20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
        100% { transform: translateY(-80px) scale(1); opacity: 0; }
      }
      .animate-sr-popup {
        animation: float-up-sr 1s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div class="scanline"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
